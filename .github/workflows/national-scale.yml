name: National scale pilot

# The heavy, one-time-ish scale pilot: audit the national NHLE source and run
# the ordinary pipeline up a stratified national ladder (25k / 50k / ~100k / ~200k).
#
# Deliberately NOT on pull requests. It fetches a ~100k-record stratified sample
# from Historic England and runs the pipeline at national scale, which is
# minutes of work that only changes when the source, the sample strategy or the
# pipeline does. Ordinary CI stays bounded; this is opt-in and scheduled.
#
# Everything is local to the runner. No hosted Supabase, no secrets, no touch of
# the canonical corpus — the national sample lives only in the runner's cache.
on:
  workflow_dispatch:
    inputs:
      largest:
        description: 'Largest checkpoint to run'
        default: '100000'
        type: choice
        options: ['25000', '50000', '100000', '200000']
  schedule:
    # First of the month, 04:00 UTC — well clear of the weekly scale ladder.
    - cron: '0 4 1 * *'

concurrency:
  group: national-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    name: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The stratified national sample is not committed (30MB of churn). The
      # manifest pins the strategy and checksum; this rebuilds it, and the
      # actions cache holds it between runs so a re-run does not re-query
      # Historic England.
      - name: Restore national sample
        id: cache
        uses: actions/cache@v4
        with:
          path: ingestion/.national-cache
          key: nhle-national-${{ hashFiles('ingestion/scale/national/manifest.json', 'ingestion/scale/national/capture.ts') }}

      - name: Audit the national source
        working-directory: ingestion
        run: pnpm exec tsx scale/national/audit.ts

      - name: Capture the stratified national sample
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ingestion
        run: pnpm exec tsx scale/national/capture.ts --refresh

      - name: Run the national ladder
        working-directory: ingestion
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          set -o pipefail
          pnpm exec tsx scale/national/run-ladder.ts --largest "${{ inputs.largest || '200000' }}" \
            | tee national-ladder.log

      - name: Summarise
        if: always()
        working-directory: ingestion
        run: |
          {
            echo '## National scale pilot'
            echo
            if [ -f national-source-audit.json ]; then
              total=$(jq -r '.counts.total' national-source-audit.json)
              cells=$(jq -r '.distribution.occupiedCells' national-source-audit.json)
              densest=$(jq -r '.distribution.topCells[0].cell' national-source-audit.json)
              share=$(jq -r '.distribution.densestCellShare' national-source-audit.json)
              echo "National source: ${total} records, ${cells} occupied 100km cells, densest ${densest} at ${share}%."
              echo
            fi
            if [ -f national-ladder.json ]; then
              echo '| stage | rec/s | ms/rec | comps/rec | heap MB | conflicts | class |'
              echo '|---:|---:|---:|---:|---:|---:|:--|'
              jq -r '.stages[] | "| \(.stage) | \(.recordsPerSecond) | \(.meanMsPerRecord) | \(.meanComparisonsPerRecord) | \(.heapUsedMb) | \(.conflicts) | \(.classification) |"' national-ladder.json
              echo
              echo "**$(jq -r '.maxProvenScale' national-ladder.json)**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pilot artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-scale
          path: |
            ingestion/national-source-audit.json
            ingestion/national-ladder.json
            ingestion/national-ladder.log
          if-no-files-found: warn
