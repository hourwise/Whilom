# Supabase local development config. `supabase start` reads this.
project_id = "whilom"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

# The seed lives in `seed/seed.sql`, not the CLI's default `supabase/seed.sql`,
# so it has to be named explicitly. Without this it was silently never loaded —
# which is why the search_places tests, which assume seeded data, failed the
# first time the database actually ran.
[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "whilom://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"
